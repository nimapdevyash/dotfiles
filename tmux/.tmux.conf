# Based on github.com/theyashsawarkar/vayu (tmux/.config/tmux/tmux.conf),
# merged with this machine's stability/resurrect hardening.
#
# Every custom bind carries a -N note, so `prefix ?` lists them with descriptions.

########## GENERAL ##########
set -g mouse on
set -g history-limit 200000              # Bigger buffer for long logs
set -g focus-events on                   # Let apps (nvim, etc.) see focus in/out
set -g allow-passthrough on              # Pass through DCS/OSC (kitty graphics, etc.)
set -g set-clipboard on                  # OSC 52 fallback for remote/nested sessions

# --- Terminal / colour ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -ga terminal-overrides ",*:Tc"
set -as terminal-features ",xterm-kitty:RGB"
# Undercurl + coloured underlines (nvim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g status-keys vi
setw -g mode-keys vi

# kitty's extended keys so C-S-<digit> / C-Enter etc. reach tmux distinctly
set -s extended-keys on
set -as terminal-features "xterm-kitty:extkeys"

# Terminal (kitty) tab/window title: "session · window"
set -g set-titles on
set -g set-titles-string "#S · #W"

set -sg escape-time 10                   # No lag on <Esc> in vim
set -g repeat-time 400
set -g display-time 2000
set -g display-panes-time 2000

# --- Windows / panes ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
setw -g aggressive-resize on

# Pane borders in the status palette; active pane gets the rose accent
set -g pane-border-lines single
set -g pane-border-style "fg=#3B4048"
set -g pane-active-border-style "fg=#D095A4"
set -g pane-border-status off
set -g message-style "bg=default,fg=#D095A4"
set -g mode-style "bg=#D095A4,fg=#0B0E14"
# tmux 3.6: these default to "#{E:mode-style}", which renders unstyled here, so set explicitly
set -g copy-mode-selection-style "bg=#D095A4,fg=#0B0E14"
set -g copy-mode-position-style "bg=#D095A4,fg=#0B0E14"
set -g copy-mode-match-style "bg=#3B4048,fg=#D4B25C"
set -g copy-mode-current-match-style "bg=#D4B25C,fg=#0B0E14"
set -g copy-mode-mark-style "bg=#C282CE,fg=#0B0E14"
set -g display-panes-active-colour "#D095A4"
set -g display-panes-colour "#6C7086"
setw -g clock-mode-colour "#D095A4"

# --- Stability guards ---
# Never let a stray hook / failed session-restore take the whole server down.
set -g exit-empty off
set -g destroy-unattached off
set -g detach-on-destroy off             # Killing a session hops to the next one


########## PREFIX ##########
unbind C-b
set -g prefix C-a
bind -N "Send Ctrl-a to the application" C-a send-prefix


########## SPLITS / WINDOWS ##########
bind -N "Split horizontally in current directory" | split-window -h -c "#{pane_current_path}"
bind -N "Split vertically in current directory" - split-window -v -c "#{pane_current_path}"
bind -N "Split horizontally (side by side) in current directory" h split-window -h -c "#{pane_current_path}"
bind -N "Split vertically (stacked) in current directory" v split-window -v -c "#{pane_current_path}"
bind -N "New window in current directory" c new-window -c "#{pane_current_path}"
bind -N "Swap window left" -r < swap-window -d -t -1
bind -N "Swap window right" -r > swap-window -d -t +1

bind -N "Reload tmux config" r source-file ~/.tmux.conf \; display "Reloaded!" \; run-shell -b "notify-send -a tmux -i utilities-terminal 'tmux' 'Config reloaded'"


########## POPUPS ##########
set -g popup-border-lines rounded
set -g popup-border-style "fg=#D095A4"
set -g popup-style "bg=#{@surface},fg=#D7DDE6"

bind -N "Floating command prompt" : display-popup -E -B -w 50% -h 3 -x C -y C "~/.tmux/scripts/cmd_prompt.sh"
bind -N "Session picker (preview, ctrl-x kill, type new name to create)" s display-popup -E -w 85% -h 85% -B "~/.tmux/scripts/sessionizer.sh"
bind -N "Classic session/window tree" w choose-tree -Zs
bind -N "Lazygit popup in current directory" g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T " lazygit " lazygit
bind -N "gh-dash popup (PRs/issues across repos)" G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T " gh-dash " "gh dash"
bind -N "Scratch shell popup (toggle)" t if -F "#{==:#{session_name},scratch}" "detach-client" "display-popup -E -w 80% -h 75% -d '#{pane_current_path}' -T ' scratch ' 'env -u TMUX tmux new-session -A -s scratch'"
bind -N "btop popup" T display-popup -E -w 90% -h 90% -T " btop " btop
# Posting (HTTP client) in its own session so open requests survive closing the popup.
# posting-glass = posting with a transparent catppuccin-mocha theme (~/.local/bin/posting-glass).
bind -N "Posting HTTP client popup (toggle)" P if -F "#{==:#{session_name},posting}" "detach-client" "display-popup -E -w 90% -h 90% -d '#{pane_current_path}' -T ' posting ' 'env -u TMUX tmux new-session -A -s posting ~/.local/bin/posting-glass \\; set -t posting status off \\; set -t posting detach-on-destroy on'"


########## NOTIFICATIONS ##########
# Bells in background windows become a desktop (mako) toast via notify-send.
set -g visual-bell off
set -g visual-activity off
set -g monitor-bell on
set -g bell-action other
set -g window-status-bell-style default
set -g window-status-activity-style default
set-hook -g alert-bell 'run-shell -b "notify-send -a tmux -i utilities-terminal \"tmux: #{session_name}\" \"Bell in window #{window_index}:#{window_name}\""'


########## NAVIGATION ##########
bind -n -N "Move focus to the pane on the left" M-Left select-pane -L
bind -n -N "Move focus to the pane on the right" M-Right select-pane -R
bind -n -N "Move focus to the pane above" M-Up select-pane -U
bind -n -N "Move focus to the pane below" M-Down select-pane -D

bind -n -N "Resize pane left by 5" M-S-Left resize-pane -L 5
bind -n -N "Resize pane right by 5" M-S-Right resize-pane -R 5
bind -n -N "Resize pane up by 2" M-S-Up resize-pane -U 2
bind -n -N "Resize pane down by 2" M-S-Down resize-pane -D 2

bind -n -N "Select window 1" C-S-1 select-window -t 1
bind -n -N "Select window 2" C-S-2 select-window -t 2
bind -n -N "Select window 3" C-S-3 select-window -t 3
bind -n -N "Select window 4" C-S-4 select-window -t 4
bind -n -N "Select window 5" C-S-5 select-window -t 5
bind -n -N "Select window 6" C-S-6 select-window -t 6

# Alt+<n> window switch: works in every terminal (C-S-<n> needs extended keys)
bind -n -N "Select window 1" M-1 select-window -t 1
bind -n -N "Select window 2" M-2 select-window -t 2
bind -n -N "Select window 3" M-3 select-window -t 3
bind -n -N "Select window 4" M-4 select-window -t 4
bind -n -N "Select window 5" M-5 select-window -t 5
bind -n -N "Select window 6" M-6 select-window -t 6
bind -n -N "Select window 7" M-7 select-window -t 7
bind -n -N "Select window 8" M-8 select-window -t 8
bind -n -N "Select window 9" M-9 select-window -t 9

bind -N "Toggle pane zoom" z resize-pane -Z
bind -N "Toggle synchronized input to all panes" S setw synchronize-panes \; display "sync #{?synchronize-panes,on,off}"
bind -N "Rename window" R command-prompt -I "#W" { rename-window "%%" }
bind -N "Last session" L switch-client -l


########## COPY MODE (vi, Wayland clipboard) ##########
bind -N "Enter copy mode" Enter copy-mode
bind-key -N "Begin visual selection (copy mode)" -T copy-mode-vi v send-keys -X begin-selection
bind-key -N "Toggle rectangle/block selection (copy mode)" -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -N "Copy selection to Wayland clipboard (copy mode)" -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -N "Cancel copy mode" -T copy-mode-vi Escape send-keys -X cancel
bind-key -N "Jump to start/end of line (copy mode)" -T copy-mode-vi H send-keys -X start-of-line
bind-key -T copy-mode-vi L send-keys -X end-of-line
# Mouse: drag copies to clipboard but keeps the highlight (click or Esc/q to exit).
bind-key -N "Copy mouse selection, keep highlight" -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection
# Double-click = word, triple-click = line (works outside copy mode too)
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "wl-copy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "wl-copy"
bind-key -n DoubleClick1Pane if -F "#{||:#{alternate_on},#{mouse_any_flag}}" { send-keys -M } { select-pane -t = ; copy-mode -M ; send-keys -X select-word ; send-keys -X copy-pipe-no-clear "wl-copy" }
bind-key -n TripleClick1Pane if -F "#{||:#{alternate_on},#{mouse_any_flag}}" { send-keys -M } { select-pane -t = ; copy-mode -M ; send-keys -X select-line ; send-keys -X copy-pipe-no-clear "wl-copy" }


########## STATUS BAR (Soft filled pills, pastel, icons throughout) ##########
set -g status-position top
set -g status-interval 5              # docker_status.sh runs `docker ps` each tick
set -g status-justify centre
set -g @surface "default"
set -g @rose "#D095A4"
set -g @peach "#F2A97E"
set -g @sage "#9ED1A6"

set -g status-style "bg=#{@surface},fg=#D7DDE6"

set -g status 2
set -g status-format[1] '#[bg=#{@surface}]'

set -g @sep_left ""
set -g @sep_right ""

# Transparent bar: only the capsules are drawn, no bar background
# (@surface = default, so status-style, the spacer row and separator caps
# all fall through to the terminal background).
# Palette #40 "Rose Dusty" (minimal): session/main = #D095A4 (also the
# shell prompt), active window = soft gold, docker
# = steel blue, inactive = gray, date = sage, time = orchid. Capsule text is
# one dark ink (#0B0E14).

set -g status-left-length 40
# Session capsule
set -g status-left " #[fg=#{?client_prefix,#{@peach},#{?pane_in_mode,#{@sage},#{@rose}}},bg=#{@surface}]#{@sep_left}#[fg=#0B0E14,bg=#{?client_prefix,#{@peach},#{?pane_in_mode,#{@sage},#{@rose}}}]   #S #[fg=#{?client_prefix,#{@peach},#{?pane_in_mode,#{@sage},#{@rose}}},bg=#{@surface}]#{@sep_right}#[default] "

# Active window: gold. Inactive: gray-blue.
setw -g window-status-current-format "#[fg=#D4B25C,bg=#{@surface}]#{@sep_left}#[fg=#0B0E14,bg=#D4B25C] #I:#W#{?window_zoomed_flag, ⤢,}#{?synchronize-panes, ⇄,} #[fg=#D4B25C,bg=#{@surface}]#{@sep_right}#[default] "
setw -g window-status-format "#[fg=#9A9FAA,bg=#{@surface}]#{@sep_left}#[fg=#0B0E14,bg=#9A9FAA] #I:#W#{?window_zoomed_flag, ⤢,}#{?synchronize-panes, ⇄,} #[fg=#9A9FAA,bg=#{@surface}]#{@sep_right}#[default] "

set -g status-right-length 60
set -g status-right "#[fg=#6C8EBF,bg=#{@surface}]#{@sep_left}#[fg=#0B0E14,bg=#6C8EBF] #( ~/.tmux/scripts/docker_status.sh ) #[fg=#6C8EBF,bg=#{@surface}]#{@sep_right}#[default] #[fg=#9ED1A6,bg=#{@surface}]#{@sep_left}#[fg=#0B0E14,bg=#9ED1A6]   %a %b %d #[fg=#9ED1A6,bg=#{@surface}]#{@sep_right}#[default] #[fg=#C282CE,bg=#{@surface}]#{@sep_left}#[fg=#0B0E14,bg=#C282CE]   %I:%M %p #[fg=#C282CE,bg=#{@surface}]#{@sep_right}#[default] "


########## PLUGINS ##########
# Auto-bootstrap tpm on a fresh machine.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Pin the plugin path so tpm never redirects to ~/.config/tmux/plugins (see vayu notes).
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'          # prefix Tab: fuzzy-pick paths/URLs/words from the pane

# --- resurrect / continuum ---
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @continuum-boot 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- extrakto ---
set -g @extrakto_popup_size '70%,50%'
set -g @extrakto_clip_tool 'wl-copy'
set -g @extrakto_fzf_layout 'reverse'

########## INITIALIZE ##########
run '~/.tmux/plugins/tpm/tpm'
